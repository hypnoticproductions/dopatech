<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOPA // VIRTUAL TRY-ON</title>
<style>
  /* --- THE WORLD (Background) --- */
  body {
    margin: 0;
    padding: 0;
    /* The Wide Luxury Room (Landscape) */
    background-image: url('https://res.cloudinary.com/dd6z9fx5m/image/upload/v1770144267/luxury-bg-wide.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    height: 100vh;
    overflow: hidden;
    font-family: 'Helvetica Neue', sans-serif;
  }

  /* Darken the room so the mirror pops */
  body::after {
    content: "";
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(8px);
    z-index: -1;
  }

  /* --- THE STAGE (The Mirror Container) --- */
  .changing-room-stage {
    position: relative;
    width: 100%;
    max-width: 450px; /* Limits width to resemble a tall mirror/phone */
    height: 100vh;
    margin: 0 auto;

    /* The Tall Mirror Reflection (Portrait) */
    background-image: url('https://res.cloudinary.com/dd6z9fx5m/image/upload/v1770144267/luxury-bg-tall.jpg');
    background-size: cover;
    background-position: center;

    /* Luxury styling */
    border-left: 1px solid rgba(255,255,255,0.2);
    border-right: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 0 100px rgba(0,0,0,1); /* Deep shadow to separate from bg */
  }

  /* --- THE ATMOSPHERE (Strobe Lights) --- */
  .strobe-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    mix-blend-mode: overlay;
    animation: luxuryPulse 6s infinite;
    z-index: 5;
  }

  @keyframes luxuryPulse {
    0% { background-color: rgba(138, 43, 226, 0.0); }
    48% { background-color: rgba(0, 255, 255, 0.05); }
    50% { background-color: rgba(255, 255, 255, 0.2); box-shadow: inset 0 0 50px rgba(255,255,255,0.5); } /* FLASH */
    52% { background-color: rgba(0, 255, 255, 0.05); }
    100% { background-color: rgba(255, 0, 150, 0.0); }
  }

  /* --- THE LOGIC (The App Embed) --- */
  .app-embed {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    border: none;
    background: transparent;
    z-index: 10;
  }
</style>
</head>
<body>

  <div class="changing-room-stage">

      <!-- 1. The Strobe Lights -->
      <div class="strobe-overlay"></div>

      <!-- 2. The App Logic -->
      <!-- IMPORTANT: After you deploy the App from Bolt/AI Studio, paste the URL below -->
      <iframe class="app-embed"
              src="https://dopamirror-virtual-t-1tmc.bolt.host"
              allow="camera; microphone; clipboard-read; clipboard-write;">
      </iframe>

  </div>

</body>
</html>
